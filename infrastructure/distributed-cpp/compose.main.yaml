services:
  main:
    image: udon-distributed-main:local
    build:
      context: .
      target: main
      args:
        APP_DIR: ${APP_DIR:-apps/example}
    init: true
    restart: "no"
    environment:
      ROLE: main
      NODE_ID: ${NODE_ID:?Set NODE_ID in .env}
      SEED: ${SEED:?Set SEED in .env}
      CLUSTER_SECRET: ${CLUSTER_SECRET:?Set CLUSTER_SECRET in .env}
      PORT: "39001"
      EXPECTED_WORKERS: ${EXPECTED_WORKERS:-2}
      STARTUP_WAIT_MS: ${STARTUP_WAIT_MS:-60000}
      JOB_TIMEOUT_MS: ${JOB_TIMEOUT_MS:-10000}
      APP_READ_TIMEOUT_MS: ${APP_READ_TIMEOUT_MS:-30000}
    ports:
      - "${BIND_IP:?Set BIND_IP to the main PC wired IPv4 address}:${HOST_PORT:-39001}:39001"
    volumes:
      - main-state:/state
    read_only: true
    tmpfs:
      - /tmp
    working_dir: /state
    stop_grace_period: 15s
volumes:
  main-state:
